name: Product Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install ruff platformdirs
      - name: Lint
        run: ruff check src tests run.py desktop_entry.py assets/generate_default_bg.py
      - name: Compile all modules
        run: python -m py_compile run.py desktop_entry.py src/*.py
      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -t . -v
