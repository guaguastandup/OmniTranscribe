name: Product Tests

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight test dependency
        run: python -m pip install platformdirs
      - name: Run persistence and subtitle tests
        run: PYTHONPATH=. python -m unittest tests.test_project_store tests.test_resumable_pipeline -v
